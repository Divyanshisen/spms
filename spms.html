<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Student Profile Management System</h1>
    </header>

    <main>
        <section class="form-container">
            <h2>Student Profile Form</h2>
            <form id="student-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required>

                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">Submit</button>
            </form>
        </section>

        <section class="profile-container">
            <h2>Student Profile</h2>
            <div class="profile-info">
                <p><strong>Name:</strong> <span id="profile-name">N/A</span></p>
                <p><strong>Age:</strong> <span id="profile-age">N/A</span></p>
                <p><strong>Course:</strong> <span id="profile-course">N/A</span></p>
                <p><strong>Email:</strong> <span id="profile-email">N/A</span></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Student Profile Management System</p>
    </footer>

    <script>
        const form = document.getElementById('student-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Get values from the form
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const course = document.getElementById('course').value;
            const email = document.getElementById('email').value;

            // Update the profile section with form values
            document.getElementById('profile-name').textContent = name;
            document.getElementById('profile-age').textContent = age;
            document.getElementById('profile-course').textContent = course;
            document.getElementById('profile-email').textContent = email;

            // Clear form fields
            form.reset();
        });
    </script>

</body>
</html>
